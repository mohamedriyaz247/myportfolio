<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mohamed Riyaz | Portfolio</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    background:#f5f5f5;
    color:#222;
}

/* NAVIGATION */

nav{
    width:100%;
    background:#f5f5f5;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:25px 8%;
    box-shadow:0 2px 10px rgba(0,0,0,.05);
}

.logo{
    font-size:28px;
    font-weight:700;
}

.logo span{
    font-size:20px;
    color:#666;
    font-weight:400;
}

.menu a{
    text-decoration:none;
    margin-left:15px;
    color:#ff5c00;
    border:1px solid #ff5c00;
    padding:10px 20px;
    border-radius:25px;
    transition:.3s;
}

.menu a:hover{
    background:#ff5c00;
    color:white;
}

/* HERO SECTION */

.hero{
    min-height:85vh;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:80px;
    padding:50px 10%;
}

/* PROFILE CARD */

.profile-card{
    width:400px;
    background:#ddd2c6;
    padding:40px;
    text-align:center;
    border-radius:15px;
    box-shadow:0 15px 35px rgba(0,0,0,.08);
    transition:.3s;
}

.profile-card:hover{
    transform:translateY(-8px);
}

.profile-card img{
    width:220px;
    height:220px;
    border-radius:50%;
    object-fit:cover;
    margin-bottom:20px;
}

.profile-card h2{
    font-size:34px;
    margin-bottom:10px;
}

.profile-card p{
    font-size:20px;
    color:#444;
}

/* CONTENT */

.content{
    max-width:600px;
}

.content h1{
    font-size:90px;
    margin-bottom:10px;
}

.content h3{
    font-size:32px;
    margin-bottom:20px;
}

.content p{
    font-size:18px;
    line-height:1.8;
    color:#555;
}

/* BUTTONS */

.buttons{
    margin-top:35px;
}

.btn{
    display:inline-block;
    text-decoration:none;
    padding:15px 35px;
    border-radius:30px;
    font-weight:600;
    margin-right:15px;
    transition:.3s;
}

.resume-btn{
    background:#4da6ff;
    color:white;
}

.resume-btn:hover{
    transform:translateY(-3px);
    box-shadow:0 10px 20px rgba(77,166,255,.3);
}

.linkedin-btn{
    border:2px solid #111;
    color:#111;
}

.linkedin-btn:hover{
    background:#111;
    color:white;
    transform:translateY(-3px);
}

/* SOCIAL INFO */

.info{
    margin-top:30px;
}

.info p{
    margin-bottom:10px;
}

/* RESPONSIVE */

@media(max-width:900px){

    .hero{
        flex-direction:column;
        text-align:center;
    }

    .content h1{
        font-size:60px;
    }

    .profile-card{
        width:100%;
        max-width:400px;
    }

}

</style>

</head>

<body>

<nav>

    <div class="logo">
        Mohamed Riyaz <span>/ DATA SCIENTIST</span>
    </div>

    <div class="menu">
        <a href="index.html">ABOUT ME</a>
        <a href="resume.html">RESUME</a>
        <a href="projects.html">PROJECTS</a>
        <a href="contact.html">CONTACT</a>
    </div>

</nav>

<section class="hero">

    <div class="profile-card">

        <!-- Replace with your photo -->
        <img src="MY PHOTO.jpeg" alt="Mohamed Riyaz">

        <h2>Mohamed Riyaz</h2>

        <p>Data Scientist</p>

    </div>

    <div class="content">

        <h1>Hello</h1>

        <h3>My name is Mohamed Riyaz</h3>

        <p>I am a Data Scientist and I work with Tech</p>

        <div class="buttons">

            <a href="MOHAMED RIYAZ RESUME(2).pdf"
               download
               class="btn resume-btn">
               RESUME
            </a>

            <a href="https://www.linkedin.com/in/mohamedriyaz247/"
               target="_blank"
               class="btn linkedin-btn">
               LINKEDIN
            </a>

        </div>

        

    </div>

</section>

</body>
</html>
