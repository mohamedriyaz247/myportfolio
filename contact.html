<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact | Mohamed Riyaz</title>

<style>

/* RESET */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    background:#ddd2c6;
    color:#222;
}

/* NAVBAR */

nav{
    width:100%;
    background:#f5f5f5;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:25px 8%;
    box-shadow:0 2px 10px rgba(0,0,0,.05);
}

.logo{
    font-size:28px;
    font-weight:700;
}

.logo span{
    font-size:20px;
    color:#666;
    font-weight:400;
}

.menu a{
    text-decoration:none;
    margin-left:15px;
    color:#ff5c00;
    border:1px solid #ff5c00;
    padding:10px 20px;
    border-radius:25px;
    transition:.3s;
}

.menu a:hover{
    background:#ff5c00;
    color:white;
}

/* PAGE TITLE */

.page-title{
    text-align:center;
    font-size:70px;
    margin-top:60px;
    margin-bottom:15px;
    letter-spacing:3px;
}

.subtitle{
    text-align:center;
    font-size:20px;
    color:#666;
    margin-bottom:50px;
}

/* CONTACT SECTION */

.contact-wrapper{
    max-width:1000px;
    margin:auto;
    padding:0 30px 80px;
}

.contact-box{
    background:white;
    border-radius:18px;
    padding:50px;
    box-shadow:0 10px 25px rgba(0,0,0,.08);
    transition:.3s;
}

.contact-box:hover{
    transform:translateY(-5px);
    box-shadow:0 20px 40px rgba(0,0,0,.12);
}

.contact-box h2{
    font-size:42px;
    margin-bottom:10px;
}

.contact-box .small-text{
    color:#666;
    margin-bottom:35px;
    font-size:18px;
}

/* FORM */

.form-row{
    display:flex;
    gap:20px;
}

.form-group{
    flex:1;
    margin-bottom:25px;
}

label{
    display:block;
    margin-bottom:10px;
    font-weight:600;
    font-size:16px;
}

input,
textarea{
    width:100%;
    padding:15px;
    border:1px solid #ddd;
    border-radius:10px;
    font-size:16px;
    outline:none;
    transition:.3s;
}

input:focus,
textarea:focus{
    border-color:#4da6ff;
    box-shadow:0 0 10px rgba(77,166,255,.2);
}

textarea{
    resize:none;
}

/* BUTTON */

.submit-btn{
    background:#111;
    color:white;
    border:none;
    padding:15px 40px;
    border-radius:30px;
    font-size:16px;
    cursor:pointer;
    transition:.3s;
}

.submit-btn:hover{
    background:#4da6ff;
    transform:translateY(-2px);
}

/* RESPONSIVE */

@media(max-width:900px){

    .form-row{
        flex-direction:column;
        gap:0;
    }

    .page-title{
        font-size:50px;
    }

    .contact-box{
        padding:30px;
    }

}

</style>
</head>

<body>

<!-- NAVBAR -->

<nav>

    <div class="logo">
        Mohamed Riyaz <span>/ DATA SCIENTIST</span>
    </div>

    <div class="menu">
        <a href="index.html">ABOUT ME</a>
        <a href="resume.html">RESUME</a>
        <a href="projects.html">PROJECTS</a>
        <a href="contact.html">CONTACT</a>
    </div>

</nav>

<!-- PAGE TITLE -->

<h1 class="page-title">CONTACT</h1>

<p class="subtitle">
    Let's connect and discuss opportunities.
</p>

<!-- CONTACT BOX -->

<div class="contact-wrapper">

    <div class="contact-box">

        <h2>Let's Talk</h2>

        <p class="small-text">
            Contact us
        </p>

        <form>

            <div class="form-row">

                <div class="form-group">
                    <label>First Name *</label>
                    <input type="text" placeholder="Enter your first name" required>
                </div>

                <div class="form-group">
                    <label>Last Name</label>
                    <input type="text" placeholder="Enter your last name">
                </div>

            </div>

            <div class="form-group">
                <label>Email *</label>
                <input type="email" placeholder="Enter your email" required>
            </div>

            <div class="form-group">
                <label>Write a Message</label>
                <textarea rows="6" placeholder="Write your message here..."></textarea>
            </div>

            <button type="submit" class="submit-btn">
                Submit
            </button>

        </form>

    </div>

</div>

</body>
</html>
